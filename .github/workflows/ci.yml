name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: false
          use-mathlib-cache: false
      - name: Tests (the #guard checks of the library)
        run: lake build FregeDiagrams.Test
      - name: Layout checks and the example figures
        run: |
          lake exe framediag _build/check --check
          lake exe framediag _build/ex --fig examples/basic.fgd --no-pdf
      - name: examples/basic.fgd draws the same as the built-in examples
        run: |
          lake exe framediag _build/a --no-pdf
          lake exe framediag _build/b --fig examples/basic.fgd --no-pdf
          diff -r -x '*.tex' _build/a _build/b
      - name: The VS Code extension's request handling (smoke test against framediag)
        run: node tools/vscode/test/smoke.js
      - name: The VS Code extension in a real VS Code (a Lean file and a figure file of another Lake project)
        run: |
          cd tools/vscode
          npm install --no-save --no-package-lock
          xvfb-run -a npm run -s test:vscode
      - name: The VS Code grammars are up to date
        run: |
          python3 docs/tools/grammar.py --textmate tools/vscode/syntaxes
          git diff --exit-code -- tools/vscode/syntaxes
      - name: The editor's file handling (raw strings in Lean files)
        run: python3 -I tools/framedit/test_framedit.py
      - name: docs/LANGUAGE.md matches the grammar, and its examples parse
        run: |
          python3 docs/tools/grammar.py --check docs/LANGUAGE.md
          python3 docs/tools/grammar.py --examples docs/LANGUAGE.md _build/lang.fgd
          lake exe framediag _build/lang --fig _build/lang.fgd --no-pdf
      - name: The syntax diagrams are up to date
        run: |
          pip install railroad-diagrams==3.0.1
          rm -rf docs/diagrams
          python3 docs/tools/grammar.py --svg docs/diagrams
          git diff --exit-code -- docs/diagrams
      - name: The pictures of the documentation are up to date
        run: |
          sh docs/tools/images.sh
          git diff --exit-code -- docs/images
          test -z "$(git status --porcelain -- docs/images)"
